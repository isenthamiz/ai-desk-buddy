[project]
name = "ai-desk-buddy-simulator"
version = "0.1.0"
description = "Desktop display simulator for AI Desk Buddy"
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5,<3.0",
    "websockets>=15,<18",
]

[project.scripts]
buddy-simulator = "aideskbuddy_simulator.app:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aideskbuddy_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
