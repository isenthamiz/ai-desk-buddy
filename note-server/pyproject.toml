[project]
name = "ai-desk-buddy-note-server"
version = "0.1.0"
description = "Private local Obsidian RAG service for AI Desk Buddy"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=2.26,<3.0",
    "pydantic>=2.11,<3.0",
    "python-dotenv>=1.1,<2.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aideskbuddy_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
